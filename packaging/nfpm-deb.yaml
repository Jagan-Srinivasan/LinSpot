name: linspot
arch: amd64
platform: linux
version: ${VERSION}
release: 1
maintainer: LinSpot contributors
vendor: LinSpot
description: One-click Wi-Fi hotspot GUI with desktop widgets
license: MIT
homepage: https://github.com/Jagan-Srinivasan/LinSpot

# Debian/Ubuntu package dependencies.
# NOTE: there is no 'polkit' package on Debian/Ubuntu (that is Arch/Fedora).
# Since Debian 12 / Ubuntu 22.04 polkit is split into 'polkitd' (daemon) and
# 'pkexec' (the setuid tool this GUI uses); 'policykit-1' is only transitional.
depends:
  - iw
  - hostapd
  - dnsmasq-base
  - iproute2
  - nftables
  - rfkill
  - wireless-regdb
  - network-manager
  - polkitd
  - pkexec
  - libgl1
  - libegl1
  - libxkbcommon0
  - libwayland-client0
  - libx11-6
  - libxcursor1
  - libxrandr2
  - libxi6

contents:
  - src: target/release/linspot
    dst: /usr/bin/linspot
    file_info:
      mode: 0755
  - src: pkg/org.linspot.policy
    dst: /usr/share/polkit-1/actions/org.linspot.policy
    file_info:
      mode: 0644
  - src: pkg/linspot.desktop
    dst: /usr/share/applications/linspot.desktop
    file_info:
      mode: 0644
  - src: data/linspot.svg
    dst: /usr/share/icons/hicolor/scalable/apps/linspot.svg
    file_info:
      mode: 0644
  - src: pkg/install.info
    dst: /etc/linspot/install.info
    file_info:
      mode: 0644
  - src: pkg/90-linspot-unmanaged.conf
    dst: /etc/NetworkManager/conf.d/90-linspot-unmanaged.conf
    file_info:
      mode: 0644

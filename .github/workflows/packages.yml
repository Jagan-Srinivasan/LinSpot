
name: Build LinSpot packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxcb-dev \
            libgl1-mesa-dev \
            golang-go

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build DEB
        run: |
          chmod +x packaging/build-packages.sh
          ./packaging/build-packages.sh deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linspot-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    container: fedora:42

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            pkg-config \
            libxkbcommon-devel \
            wayland-devel \
            libX11-devel \
            libXcursor-devel \
            libXrandr-devel \
            libXi-devel \
            libxcb-devel \
            mesa-libGL-devel \
            golang

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build RPM
        run: |
          chmod +x packaging/build-packages.sh
          ./packaging/build-packages.sh rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linspot-rpm
          path: dist/*.rpm
          if-no-files-found: error

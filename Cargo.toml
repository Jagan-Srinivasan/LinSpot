[package]
name = "linspot"
version = "1.0.0"
edition = "2021"
description = "LinSpot - one-click Wi-Fi hotspot for any Linux distro (egui GUI)"
license = "MIT"

[dependencies]
eframe = "=0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
